<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            margin: 0;
            font-family: "Roboto", Arial, sans-serif;
            background: linear-gradient(135deg, #1e293b, #1a202c);
            color: #f8f8f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #ffd700;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1rem;
            margin: 0 0 20px;
            text-align: center;
            color: #a0aec0;
        }
        .contact-container {
            background: #2d3748;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 600px;
            animation: fadeIn 1s ease-in-out;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-size: 1rem;
            color: #cbd5e0;
        }
        input, textarea {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #4a5568;
            border-radius: 8px;
            background: #1a202c;
            color: #f8f8f8;
            font-size: 1rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #63b3ed;
            box-shadow: 0 0 8px #63b3ed;
        }
        textarea {
            resize: none;
        }
        button {
            background: linear-gradient(90deg, #3182ce, #63b3ed);
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            align-self: center;
            width: 100%;
        }
        button:hover {
            background: linear-gradient(90deg, #63b3ed, #3182ce);
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .social-links {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .social-links a {
            color: #63b3ed;
            font-size: 1.5rem;
            margin: 0 10px;
            transition: color 0.3s;
        }
        .social-links a:hover {
            color: #ffd700;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <p>We'd love to hear from you! Please fill out the form below, and we'll get in touch as soon as possible.</p>
    <div class="contact-container">
        <form id="contactForm" action="home.html" method="post">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        
            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
        
            <button type="submit">Send Message</button>
        </form>
    </div>
    <div class="social-links">
        <a href="https://facebook.com" target="_blank" title="Facebook">
            <i class="fab fa-facebook"></i>
        </a>
        <a href="https://twitter.com" target="_blank" title="Twitter">
            <i class="fab fa-twitter"></i>
        </a>
        <a href="https://instagram.com" target="_blank" title="Instagram">
            <i class="fab fa-instagram"></i>
        </a>
    </div>
    <!-- Add Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script>
        document.getElementById("contactForm").addEventListener("submit", function(event){
            event.preventDefault();  // Prevent form from submitting immediately
            
            // Display the thank you alert
            alert("Thank you for your valuable time.. We'll contact you soon.");
    
            // After the alert, redirect to home.html
            window.location.href = "home.html";
        });
    </script>
    
</body>
</html>
